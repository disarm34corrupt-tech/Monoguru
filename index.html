*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.35;background:radial-gradient(circle at 20% 0,var(--bg),var(--bg2));min-height:100vh}

.setup{background:var(--panel);border-radius:18px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.22);max-width:440px;margin:0 auto}

button.sec{background:var(--line);box-shadow:0 4px 0 #b9ad88}
#game{display:none}#game.on{display:block}

.pc small{display:block;font-weight:700;opacity:.8}
.pc.now{border-color:var(--pcol);transform:translateY(-3px);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.pc.out{opacity:.4;text-decoration:line-through}
.board{position:relative;display:grid;grid-template:repeat(11,1fr)/repeat(11,1fr);gap:2px;aspect-ratio:1;background:#7a4b22;padding:6px;border-radius:16px;box-shadow:0 8px 0 rgba(0,0,0,.3),inset 0 0 0 3px #a8672f}

.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05;padding:1px;min-width:0}
.tile.sp{background:var(--sp)}
.ic{font-size:clamp(.7rem,2.4vw,1.4rem)}
.nm{font-size:clamp(.34rem,1vw,.62rem);font-weight:800;word-break:break-word}
.pr{font-size:clamp(.32rem,.9vw,.55rem);font-weight:700;opacity:.75}

.center>*:not(svg){position:relative;z-index:1}
.center h2{font-size:clamp(1rem,3.6vw,2rem);color:#2a2a22;font-weight:800;text-shadow:0 2px 0 rgba(255,255,255,.7)}

.pw{position:absolute;width:4.6%;aspect-ratio:1;margin:-3.4% 0 0 -2.3%;z-index:6;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
.pw svg{width:100%;height:100%;display:block;overflow:visible}
.pw.act svg{animation:bob 1s infinite}

.fl{position:absolute;z-index:9;font:800 clamp(.8rem,2.2vw,1.3rem) 'Baloo 2',sans-serif;transform:translate(-50%,-50%);animation:fl 1.5s forwards;text-shadow:0 0 3px #fff,0 0 3px #fff}

</style>

  $('dices').classList.remove('shake');total=v[0]+v[1];dbl=v[0]===v[1];
  if(dbl)p.pawns.forEach(function(pw){pw.jail=0});
  say(p.name+' dapat '+v[0]+' + '+v[1]+' = '+total+(dbl?' (kembar!)':'')+'. Pilih pion yang jalan.');
  var mov=p.pawns.filter(function(pw){return !pw.jail});
  if(!mov.length){say('Kedua pion '+p.name+' masih ditahan di Ruang Kepsek.');await sleep(1200);dbl=false;return endTurn()}
  if(mov.length===1)return choose(mov[0]);
  ctrl(p.pawns.map(function(pw){return ['Pion '+(pw.k?'B 👓':'A 🎓')+' · '+T[pw.pos].n,function(){choose(pw)}]}));
}
async function choose(pw){
  ctrl([]);var p=players[cur],ms=total>8?110:150;
  for(var s=0;s<total;s++){pw.pos=(pw.pos+1)%40;put(pw,ms);hop(pw,ms);snd('step');await sleep(ms+10);if(pw.pos===0){var gj=p.role.g+(p.role.id==='osis'?30:0);p.money+=gj;fl(pw,gj);say(p.name+' lewat Gajian, terima '+R(gj)+'!')}}
  list();resolve(pw);
}
async function resolve(pw){
  var p=players[cur],pi=cur,t=T[pw.pos],o=OWN[pw.pos];
  if(t.k==='prop')showCard(t.n,t.ic,'Harga '+R(t.pr)+' · Sewa dasar '+R(t.rent),0,t.col);else if(t.k==='tax')showCard(t.n,t.ic,'Iuran wajib untuk '+p.name,-t.x,'#7a8a99');else if(t.k==='libur')showCard(t.n,t.ic,'Uang saku liburan untuk '+p.name,50,'#2fa8c9');else if(t.k==='gojail')showCard(t.n,t.ic,p.name+' dipanggil kepala sekolah karena murid berkelahi, ditahan 2 giliran',0,'#b04a3a');
  if(t.k==='prop'){
    if(!o){
      if(p.money>=t.pr)say(p.name+' di '+t.n+' (harga '+R(t.pr)+', sewa '+R(t.rent)+'). Beli?');else say(p.name+' di '+t.n+', tapi uangnya tidak cukup.');
      return ctrl([['Beli '+R(t.pr),function(){p.money-=t.pr;OWN[pw.pos]={o:pi,lvl:0};updTile(pw.pos);fl(pw,-t.pr);say(p.name+' membeli '+t.n+'!');snd('buy');after()},p.money<t.pr],['Lewati & lelang',function(){auction(pw.pos)}]]);
    }
    if(o.o===pi){
      var cost=Math.floor(t.pr/2);
      if(o.lvl<3){say('Ini petakmu, '+p.name+'. Renovasi '+t.n+' seharga '+R(cost)+' untuk fasilitas '+FAC[o.lvl]+'? Sewa naik 15%.');
        return ctrl([['Renovasi '+R(cost),function(){p.money-=cost;o.lvl++;updTile(pw.pos);fl(pw,-cost);say(t.n+' mendapat fasilitas baru: '+FAC[o.lvl-1]+'! Sewa naik 15%.');showCard('Fasilitas Baru',t.ic,t.n+': '+FAC[o.lvl-1]+'. Sewa naik 15%',0,t.col);after()},p.money<cost],['Lewati',after]])}
      say('Petak milikmu sendiri, sudah renovasi maksimal.');return after();
    }
    var r=Math.round(t.rent*Math.pow(1.15,o.lvl)*(ownsAll(o.o,t.col)?1.25:1)),ow=players[o.o],hf=p.keep.indexOf('half');if(BOOST[ow.role.id]&&BOOST[ow.role.id](t.n))r=Math.round(r*1.2);if(hf>-1){p.keep.splice(hf,1);r=Math.round(r/2);say(p.name+' memakai kartu Diskon Sewa 50%!')}
    say(p.name+' '+rtx(t.n)+' di '+t.n+' (milik '+ow.name+'): bayar '+R(r)+'.');showCard('Bayar ke '+ow.name,t.ic,p.name+' '+rtx(t.n)+' di '+t.n,-r,t.col);pay(p,ow,r,pw);
    return after();
  }
  if(t.k==='tax'){say(p.name+' kena '+t.n+', bayar '+R(t.x)+'.');pay(p,null,t.x,pw);return after()}
  if(t.k==='libur'){p.money+=50;fl(pw,50);say(p.name+' libur semester, dapat uang saku '+R(50)+'!');return after()}
  if(t.k==='gojail'){say(p.name+' dipanggil kepala sekolah karena murid berkelahi!');await sleep(600);return sendJail(pw)}
  if(t.k==='fund'||t.k==='chance'){
    var c=(t.k==='fund'?FUND:CHANCE)[Math.floor(Math.random()*(t.k==='fund'?FUND:CHANCE).length)];
    say((t.k==='fund'?'💌 Dana Umum: ':'❓ Kesempatan: ')+c[0]);showCard(t.k==='fund'?'Dana Umum':'Kesempatan',cardIc(c[0],t.k),c[0],typeof c[1]==='number'?c[1]:(c[1]==='start'?200:0),t.k==='fund'?'#2f9e5a':'#e07b00');await sleep(900);
    if(c[1]==='car')return carOffer(pw,c[2]);if(typeof c[1]==='number'){if(c[1]>0){var g=Math.round(c[1]*(p.role.id==='mbg'?1.2:1));p.money+=g;fl(pw,g)}else pay(p,null,-c[1],pw);say(p.name+(c[1]>0?' dapat ':' bayar ')+R(Math.abs(c[1])));return after()}
    if(c[1]==='half'){var ps=props(pi),kk=Math.floor(ps.length/2),x;ps.sort(function(){return Math.random()-.5});for(x=0;x<kk;x++){delete OWN[ps[x]];updTile(ps[x])}var lost=Math.floor(Math.max(p.money,0)/2);p.money-=lost;if(lost)fl(pw,-lost);snd('jail');say(p.name+' terjerat pinjol! '+kk+' ruangan disita dan uang tunai berkurang separuh ('+R(lost)+').');return after()}if(c[1]==='pct'){var amt=Math.round(worth(p)*c[2]/100),cash=Math.min(amt,Math.max(p.money,0)),rem=amt-cash,ps2=props(pi).sort(function(a,b){return T[a].pr-T[b].pr}),sz=[];p.money-=cash;if(cash)fl(pw,-cash);while(rem>0&&ps2.length){var q2=ps2.shift();rem-=T[q2].pr+OWN[q2].lvl*Math.floor(T[q2].pr/2);sz.push(T[q2].n);delete OWN[q2];updTile(q2)}say(p.name+' kehilangan '+R(amt)+' (25% dari seluruh aset)'+(sz.length?', ruangan disita: '+sz.join(', '):'')+'.');return after()}if(c[1]==='keep'){p.keep.push(c[2]);say(p.name+' menyimpan kartu simpanan: '+(c[2]==='free'?'Bebas dari Ruang Kepsek':'Diskon Sewa 50%'));return after()}if(c[1]==='jail')return sendJail(pw);if(c[1]==='collect'){var cn=alive().length-1;players.forEach(function(q,qi){if(qi!==pi&&!q.out)pay(q,p,c[2],q.pawns[0])});fl(pw,c[2]*cn);say(p.name+' menerima '+R(c[2])+' dari tiap pemain lain.');return after()}
    pw.pos=0;put(pw,900);await sleep(950);p.money+=p.role.g;fl(pw,p.role.g);return after();
  }
  after();
}
async function sendJail(pw){var P=players[pw.pi],fi=P.keep.indexOf('free');if(P.role.id==='bk'){say(P.name+' (Guru BK) tidak pernah ditahan di Ruang Kepsek, lolos!');return after()}if(fi>-1){P.keep.splice(fi,1);say(P.name+' memakai kartu Bebas dari Ruang Kepsek, lolos!');return after()}snd('jail');pw.pos=10;pw.jail=2;dbl=false;put(pw,900);await sleep(950);list();after()}

var BOOST={wali:function(n){return n.indexOf('Kelas')===0},osis:function(n){return n==='Ruang OSIS'},ekskul:function(n){return ['Studio Musik','Lap. Basket','Ruang Prestasi'].indexOf(n)>-1}};
var SPEECH=['Terima kasih, {n}, atas pengabdianmu sebagai {r}. Semoga berkah dan sukses di jabatan baru!','Purna bakti {r}: jasamu dikenang seluruh ruang guru. Selamat bertugas di posisi baru, {n}!','{n}, terima kasih sudah setia menjadi {r}. Murid dan rekan guru bangga padamu!','Selamat purna tugas dari {r}, {n}! Semangatmu bikin sekolah makin hidup.'];
var SOUV=[['🏺','vas bunga keramik',30],['🖼️','foto kenangan berbingkai',20],['⌚','jam dinding Guru Teladan',40],['📜','piagam penghargaan',25],['🧣','kain batik seragam guru',35],['📖','buku kenangan tanda tangan murid',15],['🪴','pot tanaman dari kelas',20],['🏆','piala bergilir ruang guru',50]];
CHANCE.push(['Wali murid yang anaknya juara kelas menghadiahkan mobil Avanza seharga Rp9.000.000. Terima atau tolak?','car',900],['Wali murid pengusaha menawarkan mobil Pajero Sport seharga Rp15.000.000 sebagai tanda terima kasih. Terima atau tolak?','car',1500]);
async function purna(){
  var al=players.filter(function(p){return !p.out});if(al.length<2)return;
  ctrl([]);hideCard();var old=al.map(function(p){return p.role}),used={},pool=ROLES.slice().sort(function(){return Math.random()-.5}),newR=[];al.forEach(function(p,k){var r=pool.filter(function(x){return x!==old[k]&&!used[x.id]})[0]||pool.filter(function(x){return x!==old[k]})[0];used[r.id]=1;newR[k]=r});
  showAnn('Pergantian Jabatan','🔄','Mutasi jabatan! Semua guru dirotasi dan menerima gaji tambahan sesuai jabatan lama.',0,'#8a3ffc');say('🔄 Mutasi jabatan: semua guru dirotasi!');snd('bell');await sleep(1800);
  for(var i=0;i<al.length;i++){var p=al[i],o=old[i],n=newR[i],sv=SOUV[Math.floor(Math.random()*SOUV.length)],sp=SPEECH[Math.floor(Math.random()*SPEECH.length)].replace('{n}',p.name).replace('{r}',o.n.replace(/^\S+\s/,''));
    var tot=o.b+sv[2];p.role=n;p.souv.push(sv[0]);p.money+=tot;fl(p.pawns[0],tot);
    showCard('🎓 Purna Bakti',sv[0],sp+' Gaji tambahan '+R(o.b)+' + kenang-kenangan '+sv[1]+' diuangkan '+R(sv[2])+'. Jabatan baru: '+n.n,tot,'#8a3ffc');
    say('🎓 '+p.name+' purna bakti '+o.n+' (+'+R(tot)+', termasuk kenang-kenangan '+sv[0]+' yang diuangkan '+R(sv[2])+'). Kini menjabat '+n.n+'.');list();await sleep(2600)}
  hideCard();
}
function carOffer(pw,price){
  var p=players[cur];
  if(p.car){say(p.name+' masih punya urusan mobil sebelumnya, tawaran ditolak otomatis.');return after()}
  var rw=Math.round(price/10);
  ctrl([['🚗 Terima & uangkan mobil',function(){p.car=price;p.carT=0;p.money+=price;fl(pw,price);snd('buy');say(p.name+' menerima mobil dari wali murid dan langsung diuangkan '+R(price)+'. Awas, bisa dianggap gratifikasi!');list();after()}],['🙏 Tolak & lapor Inspektorat',function(){p.money+=rw;fl(pw,rw);snd('gain');say(p.name+' menolak dan melapor. Dapat apresiasi integritas '+R(rw)+'!');list();after()}]]);
}
async function disdik(){
  var p=players[cur];if(p.out||!p.car)return;p.carT=(p.carT||0)+1;
  if(Math.random()>=.25){if(p.carT>=6){p.car=0;say('Kasus hadiah mobil '+p.name+' tidak diusut lagi. Aman!');list()}return}
  var d=Math.round(p.car/3),tot=p.car+d,pw=p.pawns[0];p.car=0;
  showAnn('Panggilan Disdik','🏛️',p.name+' dipanggil Dinas Pendidikan: gratifikasi mobil terbukti! Uang hasil mobil dikembalikan plus denda, total '+R(tot)+', diperiksa 2 giliran.',-tot,'#8e2b2b');
  say('🏛️ '+p.name+' dipanggil Disdik karena gratifikasi! Bayar '+R(tot)+' (uang mobil + denda).');snd('jail');pay(p,null,tot,pw);
  if(!p.out){pw.pos=10;pw.jail=2;dbl=false;put(pw,900)}
  list();await sleep(2800);
}
function alive(){return players.filter(function(p){return !p.out})}
async function after(){
  ctrl([]);list();if(over)return;
  if(alive().length<=1)return finish();
  if(dbl&&!players[cur].out){say('Dadu kembar! '+players[cur].name+' lempar lagi.');await sleep(1000);return startTurn()}
  endTurn();
}
async function endTurn(){
  players[cur].pawns.forEach(function(pw){if(pw.jail>0)pw.jail--});
  var prev=cur;
  do{cur=(cur+1)%players.length}while(players[cur].out);
  if(cur<=prev){round++;if(round>1&&(round-1)%3===0)await purna()}
  startTurn();
}
function finish(){
  over=true;clearInterval(tm);ctrl([]);var r=players.slice().sort(function(a,b){return worth(b)-worth(a)});
  $('overT').textContent='Juara: '+r[0].name+' 🎉';
  $('rank').innerHTML=r.map(function(p){return '<li>'+esc(p.name)+(p.out?' (bangkrut)':'')+': '+R(worth(p))+'</li>'}).join('');
  var oa=$('aw');if(oa)oa.remove();$('rank').insertAdjacentHTML('afterend','<div id="aw" style="font-weight:700;font-size:clamp(.65rem,1.8vw,.95rem)">'+awards()+'</div>');$('over').classList.add('on');confetti();snd('win');
}
$('muteBtn').onclick=function(){MUTE=!MUTE;this.textContent=MUTE?'🔇 Suara mati':'🔊 Suara'};$('endBtn').onclick=function(){if(!over)finish()};
$('start').onclick=function(){
  var ins=$('names').querySelectorAll('input');players=[];
  ins.forEach(function(e,i){players.push({name:e.value.trim()||'Guru '+(i+1),money:1500,out:false,keep:[],car:0,souv:[],role:null,st:{in:0,out:0},pawns:[{pos:0,jail:0}]})});
  $('ann').innerHTML='';assignRoles();cur=0;round=1;OWN={};L=[];over=false;dbl=false;pending=null;evLeft=EVENT_MS/1000;clearInterval(tm);tm=setInterval(tick,1000);tick(true);$('setup').style.display='none';$('game').classList.add('on');$('over').classList.remove('on');
  buildBoard();faces([6,6]);startTurn();setTimeout(function(){say('Peran: '+players.map(function(p){return p.name+' = '+p.role.n}).join(' · '))},80);
};
$('again').onclick=function(){over=true;clearInterval(tm);$('game').classList.remove('on');$('setup').style.display='block'};
